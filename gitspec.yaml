# GitSpec site configuration.
#
# GitSpec reads this file from the repository root. It maps the directories in
# this repository that hold documentation onto the spaces GitSpec serves.
#
# This repository is GitSpec's own first user: the spaces below are real, and the
# product is developed against them.

version: 1

site:
  title: GitSpec

# Where edits from the editor are proposed. Absent means the site is read-only, which
# is the default: a site is useful before anyone can write to it.
repository:
  owner: PasserBo
  name: GitSpec
  branch: main

# How readers sign in before editing. Commented out until the broker is deployed:
# without it the editor falls back to a pasted token, which is scaffolding but works.
# Both values are public — the client secret lives only in the broker's environment.
#
# auth:
#   clientId: Iv23liJvhF7nbMOPOAeu
#   broker: https://gitspec-broker.<your-subdomain>.workers.dev

spaces:
  # `key` is this space's permanent identity, and is what GitSpec matches on from
  # one sync to the next. It is deliberately independent of `title`, `path` and
  # `directory`, so that all three can change without the space being replaced.
  # Renaming a key means deleting a space and creating a different one.
  - key: gitspec-docs
    title: GitSpec
    path: /
    directory: ./docs

# Defaults applied to every space unless it overrides them:
#
#   readme:  README.md     the space's home page
#   summary: SUMMARY.md     the space's navigation; a document absent from it is
#                           still rendered, but is not linked from the sidebar
