version: 1
site:
  title: Scattered
spaces:
  - key: scattered-docs
    title: Docs
    path: /
    include:
      - "docs/**/*.md"
      - "src/**/spec.md"
      - "packages/*/README.md"
    exclude:
      - "**/CHANGELOG.md"
    # A-5: an `include` space implies no home, so it names one.
    home: docs/README.md
