# Copy this into .github/workflows/ of your own repository.
#
# It needs no secret and contacts no GitSpec service. Enable Pages once
# (Settings > Pages > Source: GitHub Actions), and add a gitspec.yaml at the root.

name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PasserBo/GitSpec@main
        with:
          output: _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
